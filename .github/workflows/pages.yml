name: Build Swiss Ephemeris and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout official Swiss Ephemeris
        uses: actions/checkout@v4
        with:
          repository: aloistr/swisseph
          ref: v2.10.3bfinal
          path: upstream/swisseph

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.13"
          actions-cache-folder: emsdk-cache

      - name: Build Swiss Ephemeris WASM
        shell: bash
        run: |
          mkdir -p vendor

          emcc bridge.c \
            upstream/swisseph/sweph.c \
            upstream/swisseph/swephlib.c \
            upstream/swisseph/swehouse.c \
            upstream/swisseph/swecl.c \
            upstream/swisseph/swemplan.c \
            upstream/swisseph/swejpl.c \
            -Iupstream/swisseph \
            -O3 \
            -sMODULARIZE=1 \
            -sEXPORT_ES6=1 \
            -sENVIRONMENT=web \
            -sALLOW_MEMORY_GROWTH=1 \
            -sEXPORTED_FUNCTIONS='["_malloc","_free","_swe_julday","_swe_close","_bridge_calc_ut","_bridge_houses"]' \
            -sEXPORTED_RUNTIME_METHODS='["cwrap"]' \
            -o vendor/swisseph.js

      - name: Copy Swiss Ephemeris licenses
        shell: bash
        run: |
          cp upstream/swisseph/agpl-3.0.txt vendor/AGPL-3.0.txt
          cp upstream/swisseph/LICENSE vendor/SWISSEPH-LICENSE.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
